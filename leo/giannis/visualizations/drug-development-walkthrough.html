<div id="drug-learning-545-20261120">
  <style>
    #drug-learning-545-20261120 {
      --dl-edge: color-mix(in srgb, var(--foreground) 45%, var(--background));
      --dl-rule: color-mix(in srgb, var(--foreground) 20%, var(--background));
      --dl-side: color-mix(in srgb, var(--foreground) 6%, var(--background));
      --dl-mark: var(--viz-series-1);
      --dl-soft: color-mix(in srgb, var(--viz-series-1) 12%, var(--background));
      display: grid;
      gap: calc(var(--font-size-base) * 1);
      width: 100%;
      color: var(--foreground);
    }
    #drug-learning-545-20261120 .dl-heading { padding-inline-end: 96px; }
    #drug-learning-545-20261120 .dl-illustration {
      display: grid;
      gap: calc(var(--font-size-base) * 1);
      margin: 0;
      min-width: 0;
    }
    #drug-learning-545-20261120 .dl-flow {
      display: grid;
      grid-template-columns: var(--dl-tracks);
      align-items: start;
      min-width: 0;
    }
    #drug-learning-545-20261120 .dl-node {
      display: grid;
      grid-template-rows: 102px auto;
      gap: calc(var(--font-size-base) * 0.5);
      min-width: 0;
      align-items: start;
    }
    #drug-learning-545-20261120 .dl-drawing {
      display: block;
      width: 100%;
      max-width: 160px;
      height: 102px;
      justify-self: center;
    }
    #drug-learning-545-20261120 .dl-drawing path,
    #drug-learning-545-20261120 .dl-drawing line,
    #drug-learning-545-20261120 .dl-drawing rect,
    #drug-learning-545-20261120 .dl-drawing circle {
      vector-effect: non-scaling-stroke;
      stroke-linejoin: round;
    }
    #drug-learning-545-20261120 .dl-label {
      display: grid;
      gap: calc(var(--font-size-base) * 0.25);
      text-align: center;
      overflow-wrap: anywhere;
      min-width: 0;
    }
    #drug-learning-545-20261120 .dl-name { font-weight: 500; }
    #drug-learning-545-20261120 .dl-values {
      display: grid;
      gap: calc(var(--font-size-base) * 0.25);
      color: var(--muted-foreground);
    }
    #drug-learning-545-20261120 .dl-link {
      display: block;
      width: 100%;
      height: 16px;
      margin-block-start: 43px;
      color: var(--dl-edge);
      overflow: visible;
    }
    #drug-learning-545-20261120 .dl-link .dl-down { display: none; }
    #drug-learning-545-20261120 .dl-row-caption { color: var(--muted-foreground); }
    #drug-learning-545-20261120.dl-narrow .dl-flow { grid-template-columns: 140px minmax(0, 1fr); }
    #drug-learning-545-20261120.dl-narrow .dl-node {
      grid-column: 1 / -1;
      grid-template-columns: 140px minmax(0, 1fr);
      grid-template-rows: auto;
      align-items: center;
      column-gap: 16px;
    }
    #drug-learning-545-20261120.dl-narrow .dl-drawing { width: 140px; }
    #drug-learning-545-20261120.dl-narrow .dl-label { text-align: start; }
    #drug-learning-545-20261120.dl-narrow .dl-link {
      grid-column: 1;
      width: 140px;
      height: 30px;
      margin: 0;
    }
    #drug-learning-545-20261120.dl-narrow .dl-link .dl-across { display: none; }
    #drug-learning-545-20261120.dl-narrow .dl-link .dl-down { display: inline; }
  </style>

  <h2 class="dl-heading">From trial records to a prediction question</h2>
  <div class="viz-controls">
    <label class="form-label" for="drug-learning-stage-545">Explore a stage
      <select id="drug-learning-stage-545" class="form-select">
        <option value="source">Source tables</option>
        <option value="arms">Correct arm linkage</option>
        <option value="history">Program history</option>
        <option value="snapshots">Snapshots</option>
        <option value="readiness">Model-readiness</option>
      </select>
    </label>
  </div>
  <figure class="dl-illustration" aria-label="Drug-development data pipeline" data-dl-figure></figure>
  <div class="text-small" data-dl-detail aria-live="polite"></div>

  <script>
    (() => {
      const root = document.getElementById('drug-learning-545-20261120');
      if (!root) return;
      const select = root.querySelector('#drug-learning-stage-545');
      const figure = root.querySelector('[data-dl-figure]');
      const detail = root.querySelector('[data-dl-detail]');
      const namespace = 'http://www.w3.org/2000/svg';
      const arrowId = 'drug-learning-arrow-545';
      const svgParts = {
        records: `<g transform="matrix(.85 .2125 -.4675 .578 45 8)">
          <path d="M0 90H120l2 3.6H2Z M120 0l2 3.6v90l-2-3.6Z" fill="var(--dl-side)" stroke="var(--dl-edge)" stroke-width=".8"/>
          <path d="M0 0H120V90H0Z" fill="var(--background)" stroke="var(--dl-edge)" stroke-width=".8"/>
          <path d="M9 10H111V27H9Z" fill="var(--dl-side)"/>
          <path d="M9 10H111V80H9Z M9 27H111 M9 44H111 M9 62H111 M40 10V80 M79 10V80" fill="none" stroke="var(--dl-rule)" stroke-width=".8"/>
          <path d="M12 31H36V40H12Z M12 48H36V58H12Z M12 66H36V76H12Z" fill="var(--dl-soft)"/>
        </g>`,
        arms: `<path d="M20 51H44V25H91 M44 51V77H91" fill="none" stroke="var(--dl-edge)" stroke-width="1"/>
          <path d="M92 12H148V38H92Z M92 64H148V90H92Z" fill="var(--background)" stroke="var(--dl-edge)" stroke-width=".8"/>
          <circle cx="20" cy="51" r="8" fill="var(--dl-side)" stroke="var(--dl-edge)" stroke-width=".8"/>
          <circle cx="120" cy="25" r="8" fill="var(--dl-soft)" stroke="var(--dl-mark)" stroke-width="1"/>
          <circle cx="120" cy="77" r="8" fill="var(--background)" stroke="var(--dl-edge)" stroke-width=".8"/>`,
        combo: `<path d="M27 19H148V83H27Z" fill="var(--background)" stroke="var(--dl-edge)" stroke-width=".8"/>
          <path d="M27 33H148" fill="none" stroke="var(--dl-rule)" stroke-width=".8"/>
          <path d="M10 51H39 M72 55H103" fill="none" stroke="var(--dl-edge)" stroke-width="1"/>
          <circle cx="61" cy="55" r="11" fill="var(--dl-soft)" stroke="var(--dl-mark)" stroke-width="1"/>
          <circle cx="115" cy="55" r="11" fill="var(--dl-soft)" stroke="var(--dl-mark)" stroke-width="1"/>`,
        program: `<g transform="matrix(.85 .2125 -.4675 .578 49 8)">
          <path d="M-4 6H116V96H-4Z" fill="var(--dl-side)" stroke="var(--dl-edge)" stroke-width=".8"/>
          <path d="M0 0H120V90H0Z" fill="var(--background)" stroke="var(--dl-edge)" stroke-width=".8"/>
          <path d="M10 12H110V30H10Z" fill="var(--dl-soft)"/>
          <path d="M12 42H108 M12 58H108 M12 74H108 M42 36V81" fill="none" stroke="var(--dl-rule)" stroke-width=".8"/>
          <path d="M12 19H37 M47 19H102" fill="none" stroke="var(--dl-mark)" stroke-width="1.3"/>
        </g>`,
        phase1: `<path d="M13 78H149" fill="none" stroke="var(--dl-edge)" stroke-width="1"/>
          <path d="M37 17H111V67H37Z" fill="var(--background)" stroke="var(--dl-edge)" stroke-width=".8"/>
          <path d="M47 29H101 M47 40H90 M47 51H96" fill="none" stroke="var(--dl-rule)" stroke-width="1"/>
          <line x1="74" y1="67" x2="74" y2="78" stroke="var(--dl-edge)" stroke-width="1"/>
          <circle cx="74" cy="78" r="5" fill="var(--dl-mark)"/>`,
        phase2: `<path d="M13 78H149" fill="none" stroke="var(--dl-edge)" stroke-width="1"/>
          <path d="M32 23H106V73H32Z" fill="var(--dl-side)" stroke="var(--dl-edge)" stroke-width=".8"/>
          <path d="M39 14H113V64H39Z" fill="var(--background)" stroke="var(--dl-edge)" stroke-width=".8"/>
          <path d="M49 26H103 M49 37H92 M49 48H98" fill="none" stroke="var(--dl-rule)" stroke-width="1"/>
          <line x1="76" y1="64" x2="76" y2="78" stroke="var(--dl-edge)" stroke-width="1"/>
          <circle cx="76" cy="78" r="5" fill="var(--dl-mark)"/>`,
        snapshot: `<path d="M20 13H139V90H20Z" fill="var(--background)" stroke="var(--dl-edge)" stroke-width=".8"/>
          <path d="M20 32H139 M33 8V23 M126 8V23" fill="none" stroke="var(--dl-edge)" stroke-width="1"/>
          <path d="M32 43H126 M32 57H126 M32 71H126 M51 39V82 M76 39V82 M101 39V82" fill="none" stroke="var(--dl-rule)" stroke-width=".8"/>
          <path d="M53 59H74V70H53Z" fill="var(--dl-soft)"/>
          <line x1="78" y1="37" x2="78" y2="85" stroke="var(--dl-mark)" stroke-width="1.5"/>`,
        event: `<line x1="19" y1="77" x2="145" y2="77" stroke="var(--dl-edge)" stroke-width="1"/>
          <line x1="51" y1="16" x2="51" y2="83" stroke="var(--dl-rule)" stroke-width="1"/>
          <line x1="51" y1="49" x2="117" y2="49" stroke="var(--dl-edge)" stroke-width="1"/>
          <circle cx="117" cy="49" r="13" fill="var(--background)" stroke="var(--dl-edge)" stroke-width="1"/>
          <circle cx="51" cy="77" r="4" fill="var(--dl-mark)"/>`,
        gate: `<path d="M9 26H43V51H73 M9 51H73 M9 76H43V51" fill="none" stroke="var(--dl-rule)" stroke-width="1"/>
          <path d="M76 17V85 M88 17V85 M76 17H88 M76 85H88" fill="none" stroke="var(--dl-edge)" stroke-width="1"/>
          <path d="M76 51H88" fill="none" stroke="var(--dl-mark)" stroke-width="2"/>
          <path d="M99 51H148" fill="none" stroke="var(--dl-rule)" stroke-width="1" stroke-dasharray="4 4"/>`,
        planned: `<path d="M25 14H136V87H25Z" fill="var(--background)" stroke="var(--dl-edge)" stroke-width=".8" stroke-dasharray="4 4"/>
          <path d="M37 29H123 M37 42H108 M37 69H123" fill="none" stroke="var(--dl-rule)" stroke-width="1"/>
          <path d="M37 55H123" fill="none" stroke="var(--dl-rule)" stroke-width="1" stroke-dasharray="3 4"/>`
      };
      const stages = {
        source: {
          caption: 'Executed cleaning · current registry snapshot',
          flows: [[
            ['records', 'Source trials', ['151,081 studies', 'One row per NCT ID']],
            ['arms', 'Strictly linked trials', ['67,109 studies', 'Experimental arms only']],
            ['program', 'Candidate programs', ['71,485 program identities', 'Regimen + indication']]
          ]],
          detail: 'Studies and programs are different counting units; these numbers are not a phase-success rate.'
        },
        arms: {
          caption: 'Toy examples · the arm assignment changes the regimen',
          rowLabels: ['Comparator trial: Drug A versus Drug B', 'Combination trial: Drug A plus Drug B'],
          flows: [[
            ['arms', 'Two separate arms', ['Experimental: Drug A', 'Comparator: Drug B']],
            ['program', 'Retained candidate', ['Drug A + Disease X', 'Drug B is not added to A']]
          ], [
            ['combo', 'One experimental arm', ['Drug A and Drug B', 'Both explicitly assigned']],
            ['program', 'Retained combination', ['[Drug A, Drug B] + Disease X', 'A distinct regimen']]
          ]],
          detail: 'Being in the same trial does not mean drugs were given together; ambiguous alternatives are excluded.'
        },
        history: {
          caption: '5,333 multi-trial candidates · 2,522 with multiple phase labels',
          flows: [[
            ['phase1', 'Phase 1 · toy', ['Trial T1', 'Candidate program P1']],
            ['phase2', 'Phase 2 · toy', ['Trial T2', 'Candidate program P1']],
            ['phase1', 'Phase 3 · toy', ['Trial T3', 'Candidate program P1']]
          ]],
          detail: 'Matching exact regimen and indication labels gives a candidate history, not verified development continuity.'
        },
        snapshots: {
          caption: 'Toy schema · inputs stop at the snapshot; the outcome comes later',
          flows: [[
            ['records', 'Source ID', ['Trial T1', 'nct_id']],
            ['combo', 'Arm + condition', ['Drug A; Disease X', 'Assigned treatment']],
            ['program', 'Program ID', ['Candidate P1', 'regimen + indication']],
            ['snapshot', 'Snapshot date', ['2010-07-01 · toy', 'Available inputs only']],
            ['event', 'Future event', ['Later Phase 3 evidence', 'Outcome, not an input']]
          ]],
          detail: 'A future Phase 3 start must never become an input to an earlier prediction.'
        },
        readiness: {
          caption: 'Counts shown as snapshots / mature snapshots / observed Phase 3 events',
          flows: [[
            ['records', 'Checkpoint risk sets', ['Baseline: 13,701 / 7,689 / 53', 'After Phase 1: 1,878 / 870 / 2', 'After Phase 2: 80 / 27 / 0']],
            ['gate', 'Model-readiness gate', ['Chronological holdout', 'Independent drug groups', 'Enough outcome events']],
            ['planned', 'Planned probabilities', ['Not estimated', 'No validated individual chance']]
          ]],
          detail: 'Fitting is blocked by insufficient held-out support; checkpoint counts are not predicted chances.'
        }
      };

      function element(tag, className, value) {
        const item = document.createElement(tag);
        if (className) item.className = className;
        if (value !== undefined) item.textContent = value;
        return item;
      }
      function drawing(kind, label) {
        const svg = document.createElementNS(namespace, 'svg');
        svg.setAttribute('class', 'dl-drawing');
        svg.setAttribute('viewBox', '0 0 160 102');
        svg.setAttribute('role', 'img');
        const bounds = {
          records: [3, 8, 149, 89], arms: [12, 12, 149, 91], combo: [10, 19, 149, 84],
          program: [0, 8, 152, 89], phase1: [13, 17, 149, 84], phase2: [13, 14, 149, 84],
          snapshot: [20, 8, 139, 91], event: [19, 16, 145, 84], gate: [9, 17, 148, 85], planned: [25, 14, 136, 88]
        };
        svg.dataset.bounds = bounds[kind].join(',');
        const title = document.createElementNS(namespace, 'title');
        title.textContent = label;
        svg.appendChild(title);
        const geometry = document.createElementNS(namespace, 'g');
        geometry.innerHTML = svgParts[kind];
        svg.appendChild(geometry);
        return svg;
      }
      function connector(first) {
        const svg = document.createElementNS(namespace, 'svg');
        svg.setAttribute('class', 'dl-link');
        svg.setAttribute('aria-hidden', 'true');
        svg.setAttribute('fill', 'none');
        svg.setAttribute('stroke', 'currentColor');
        svg.setAttribute('stroke-width', '1.2');
        svg.innerHTML = (first ? `<defs><marker id="${arrowId}" orient="auto" markerUnits="userSpaceOnUse" refX="8" refY="5" markerWidth="10" markerHeight="10"><path d="M1 1L8 5 1 9" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>` : '')
          + `<line class="dl-across" x1="3" y1="50%" x2="94%" y2="50%" marker-end="url(#${arrowId})"/><line class="dl-down" x1="50%" y1="1" x2="50%" y2="90%" marker-end="url(#${arrowId})"/>`;
        return svg;
      }
      function render(stageKey) {
        const key = Object.hasOwn(stages, stageKey) ? stageKey : 'source';
        select.value = key;
        const stage = stages[key];
        figure.replaceChildren();
        figure.appendChild(element('figcaption', 'text-small dl-row-caption tabular-nums', stage.caption));
        let markerCreated = false;
        stage.flows.forEach((nodes, row) => {
          if (stage.rowLabels) figure.appendChild(element('div', 'text-small dl-row-caption', stage.rowLabels[row]));
          const flow = element('div', 'dl-flow');
          const tracks = [];
          nodes.forEach((node, index) => {
            if (index) {
              tracks.push(nodes.length > 3 ? '24px' : '44px');
              flow.appendChild(connector(!markerCreated));
              markerCreated = true;
            }
            tracks.push('minmax(0,1fr)');
            const plate = element('div', 'dl-node');
            plate.appendChild(drawing(node[0], node[1]));
            const label = element('div', 'dl-label');
            label.appendChild(element('div', 'dl-name', node[1]));
            const values = element('div', 'dl-values text-small tabular-nums');
            node[2].forEach(value => values.appendChild(element('span', '', value)));
            label.appendChild(values);
            plate.appendChild(label);
            flow.appendChild(plate);
          });
          flow.style.setProperty('--dl-tracks', tracks.join(' '));
          figure.appendChild(flow);
        });
        figure.setAttribute('aria-label', select.options[select.selectedIndex].text + ': ' + stage.caption);
        detail.textContent = stage.detail;
        requestAnimationFrame(layoutConnectors);
      }
      function stageFromState(state) {
        const key = state?.privateContent?.stage || state?.modelContent?.stage;
        return typeof key === 'string' && Object.hasOwn(stages, key) ? key : 'source';
      }
      function responsiveLayout() {
        root.classList.toggle('dl-narrow', root.getBoundingClientRect().width < 560);
        requestAnimationFrame(layoutConnectors);
      }
      function paintedBounds(svg) {
        const box = svg.getBoundingClientRect();
        const scale = Math.min(box.width / 160, box.height / 102);
        const [x1, y1, x2, y2] = svg.dataset.bounds.split(',').map(Number);
        const x = box.left + (box.width - 160 * scale) / 2;
        const y = box.top + (box.height - 102 * scale) / 2;
        return { left: x + x1 * scale, right: x + x2 * scale, top: y + y1 * scale, bottom: y + y2 * scale };
      }
      function layoutConnectors() {
        const narrow = root.classList.contains('dl-narrow');
        figure.querySelectorAll('.dl-link').forEach(link => {
          const before = paintedBounds(link.previousElementSibling.querySelector('.dl-drawing'));
          const after = paintedBounds(link.nextElementSibling.querySelector('.dl-drawing'));
          const box = link.getBoundingClientRect();
          if (narrow) {
            const line = link.querySelector('.dl-down');
            line.setAttribute('y1', before.bottom + 10 - box.top);
            line.setAttribute('y2', after.top - 10 - box.top);
          } else {
            const line = link.querySelector('.dl-across');
            line.setAttribute('x1', before.right + 10 - box.left);
            line.setAttribute('x2', after.left - 10 - box.left);
          }
        });
      }
      select.addEventListener('change', () => {
        render(select.value);
        if (typeof window.openai?.setWidgetState === 'function') {
          window.openai.setWidgetState({
            modelContent: { stage: select.value, topic: 'drug-development pipeline', predictionsEstimated: false },
            privateContent: { stage: select.value }
          }).catch(() => {});
        }
      });
      window.addEventListener('openai:set_globals', event => {
        if (event.detail?.globals && Object.hasOwn(event.detail.globals, 'widgetState')) {
          render(stageFromState(event.detail.globals.widgetState));
        }
      });
      new ResizeObserver(responsiveLayout).observe(root);
      responsiveLayout();
      render(stageFromState(window.openai?.widgetState));
    })();
  </script>
</div>
