<script type="module">
import {mountChart} from "https://persistent.oaistatic.com/plugins/visualize/charts/1.8.1/element.js";
const root=document.getElementById("dtp-analysis-lab");
const select=root.querySelector("#dtp-analysis-select");
const configs=Object.fromEntries(Array.from(root.querySelectorAll("[data-viz-chart]")).map(el=>[el.dataset.key,JSON.parse(el.textContent)]));
function savedValue(state){const key=state?.modelContent?.analysisView;return Object.hasOwn(configs,key)?key:"sigmoid";}
let current=savedValue(window.openai?.widgetState);
select.value=current;
const chart=mountChart(root.querySelector("[data-viz-container]"),configs[current]);
const details=root.querySelector("#dtp-analysis-counts");
const head=root.querySelector("#dtp-analysis-head");
const body=root.querySelector("#dtp-analysis-body");
function apply(key,save){
 current=Object.hasOwn(configs,key)?key:"sigmoid";
 select.value=current;chart.config=configs[current];
 details.hidden=current==="sigmoid";
 head.replaceChildren();body.replaceChildren();
 let headers=[],rows=[];
 if(current==="calibration"){headers=["Predicted","Events","Examples","Observed"];rows=[["20%","1","20","5%"],["50%","5","20","25%"],["80%","11","20","55%"]];}
 if(current==="cohort"){headers=["Checkpoint","Mature","Observed events","No matched event"];rows=[["Registry entry","7,689","53","7,636"],["After Phase 1","870","2","868"],["After Phase 2","27","0","27"]];}
 for(const text of headers){const th=document.createElement("th");th.scope="col";th.textContent=text;head.append(th);}
 for(const values of rows){const tr=document.createElement("tr");for(const text of values){const td=document.createElement("td");td.textContent=text;tr.append(td);}body.append(tr);}
 root.querySelector("#dtp-analysis-status").textContent=current==="cohort"?"All three real-data model fits were not estimable; event counts are not clinical success rates.":current==="calibration"?"Illustrative probabilities are overconfident: observed fractions fall below the diagonal.":"The mathematical curve converts a score into a probability; it does not supply learned coefficients.";
 if(save&&window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{analysisView:current},privateContent:null}).catch(()=>{});
}
select.disabled=false;apply(current,false);
select.addEventListener("change",()=>apply(select.value,true));
window.addEventListener("openai:set_globals",event=>{if(event.detail?.globals?.widgetState)apply(savedValue(event.detail.globals.widgetState),false);});
</script>
